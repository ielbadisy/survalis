url: https://elbadisyimad.com/survalis/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#0f172a"
    navbar-bg: "#0f172a"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

reference:
- title: Verbs
  desc: >
    Fit a learner, predict, evaluate, compare, tune, interpret and estimate
    contrasts from one formula and one dataset. Every learner, built in or
    your own, goes in `model`.
  contents:
  - fit
  - predict.survalis_fit
  - evaluate
  - compare
  - tune
  - interpret
  - estimate
  - survalis-tidiers
  - survalis-package

- title: Resampling
  desc: Split schemes used by `evaluate()`, `compare()`, `tune()` and `estimate()`.
  contents:
  - resampling
  - holdout
  - cv
  - group_cv
  - bootstrap

- title: Scores
  desc: Decision-weighted scores over stated risk thresholds.
  contents:
  - dwscore

- title: Lookups
  desc: Valid ids for `model`, `metrics` and `method`.
  contents:
  - list_survlearners
  - list_metrics
  - list_interpretability_methods

- title: Data and re-exports
  contents:
  - veteran
  - reexports

articles:
- title: Guides
  navbar: ~
  contents:
  - causal-estimation
- title: Upgrading
  navbar: Upgrading
  contents:
  - from-1.0

news:
  cran_dates: true
